<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One registration. Two ways to see it. — Interactive Case Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html,body{margin:0;padding:0;background:#EDE4D4;font-family:'Manrope',system-ui,sans-serif;color:#241C15}
  a{color:#D98C1F}a:hover{color:#B36F0F}
  input,select,button,textarea{font-family:inherit}
  input:focus{outline:2px solid #F2A93B;outline-offset:0;border-color:#F2A93B}
  @keyframes toastIn{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes popIn{0%{transform:scale(.88);opacity:0}70%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
  @keyframes fall{0%{transform:translateY(-30px) rotate(0deg);opacity:1}85%{opacity:1}100%{transform:translateY(860px) rotate(600deg);opacity:0}}
  @keyframes pulseChip{0%{transform:scale(1)}50%{transform:scale(1.09)}100%{transform:scale(1)}}
  /* hover states (ported from the prototype's style-hover) */
  .choice-amber{transition:transform .15s ease, box-shadow .15s ease}
  .choice-amber:hover{transform:translateY(-2px);box-shadow:0 12px 24px -8px rgba(217,140,31,.65)}
  .choice-white{transition:transform .15s ease, border-color .15s ease}
  .choice-white:hover{border-color:#D98C1F;transform:translateY(-2px)}
  .qcard-flag{transition:border-color .15s ease}
  .qcard-flag:hover{border-color:#E8654B}
  .qcard-yours{transition:border-color .15s ease}
  .qcard-yours:hover{border-color:#D98C1F}
  .restart-pill{transition:border-color .15s ease, color .15s ease}
  .restart-pill:hover{border-color:#F2A93B;color:#F2A93B}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/plain" id="babel-src">

// ── static config (was <x-dc> props) ─────────────────────────────
const PROPS = {
  showStateChip: true,
  confettiOn: true,
  oldFlowLabel: '~5 hours of manual handling plus 2–3 days of email latency'
};

class App extends React.Component {
  state = {
    screen: 'intro',
    inter: null,
    name: '', contact: '', nameErr: false, contactErr: false,
    flagReturned: false, yoursApproved: false,
    slip: false, paid: false, payErr: false,
    savedMin: 0, dispMin: 0,
    toast: null, toastTone: 'ok',
    startT: null, elapsed: '',
    confetti: null
  };

  go(screen, extra) { this.setState(Object.assign({ screen: screen }, extra || {})); }

  showToast(text, tone) {
    clearTimeout(this._toastT);
    this.setState({ toast: text, toastTone: tone || 'ok' });
    this._toastT = setTimeout(() => this.setState({ toast: null }), 4200);
  }

  addSaved(min) {
    // Accumulate the target on the instance so overlapping calls never read a
    // stale savedMin from async state.
    const target = (this._target || 0) + min;
    this._target = target;
    this.setState({ savedMin: target });
    clearInterval(this._cntT);
    // Capture this interval's own id and clear by it — NOT by this._cntT, which a
    // newer addSaved may have reassigned (an old queued tick would otherwise kill
    // the newer animation and freeze the counter short of the total).
    const id = setInterval(() => {
      this.setState(s => {
        if (s.dispMin >= target) { clearInterval(id); return { dispMin: target }; }
        return { dispMin: Math.min(target, s.dispMin + Math.max(2, Math.ceil((target - s.dispMin) / 6))) };
      });
    }, 40);
    this._cntT = id;
  }

  fmtMin(m) {
    const h = Math.floor(m / 60), mm = m % 60;
    if (h === 0) return mm + 'm';
    return h + 'h ' + (mm < 10 ? '0' : '') + mm + 'm';
  }

  resetPlay() {
    this._target = 0;
    return { name: '', contact: '', nameErr: false, contactErr: false, flagReturned: false, yoursApproved: false, slip: false, paid: false, payErr: false, savedMin: 0, dispMin: 0, toast: null, confetti: null };
  }

  choosePlay = () => {
    this.setState(Object.assign(this.resetPlay(), {
      startT: Date.now(),
      screen: 'inter',
      inter: {
        kicker: 'ROLE 1 OF 2 · THE CORPORATE CLIENT',
        title: 'Your company is sending someone abroad.',
        body: 'HR asked you to register a colleague for a 4-week language course. This used to be a Word form emailed back and forth for days. Now it’s one screen, mostly pre-filled. Two fields are yours.',
        cta: 'Open the registration form',
        next: 'form', saved: null
      }
    }));
  };

  chooseGuided = () => { this.setState({ screen: 'g1', toast: null }); };
  gotoGuided = () => { this.setState({ screen: 'g1', toast: null }); };

  restartAll = () => {
    clearInterval(this._cntT); clearTimeout(this._toastT); clearTimeout(this._celT);
    this.setState(Object.assign(this.resetPlay(), { screen: 'intro', inter: null, startT: null }));
  };

  interGo = () => {
    const n = this.state.inter && this.state.inter.next;
    this.setState({ screen: n || 'intro', inter: null });
  };

  onName = (e) => this.setState({ name: e.target.value, nameErr: false });
  onContact = (e) => this.setState({ contact: e.target.value, contactErr: false });

  submitForm = () => {
    const nErr = !this.state.name.trim(), cErr = !this.state.contact.trim();
    if (nErr || cErr) {
      this.setState({ nameErr: nErr, contactErr: cErr });
      const n = (nErr ? 1 : 0) + (cErr ? 1 : 0);
      this.showToast('⚠ Blocked: ' + n + ' required field' + (n > 1 ? 's' : '') + ' missing. Each one names its rule below.', 'err');
      return;
    }
    this.addSaved(150);
    this.setState({
      screen: 'inter',
      inter: {
        kicker: 'SUBMITTED · SWITCHING TO ROLE 2 OF 2',
        title: 'Now you’re the reviewer.',
        body: 'Your registration is now in the agency’s queue, as a tracked object with a state, not an email. Two requests are waiting. One has a problem.',
        cta: 'Open the reviewer queue',
        next: 'queue',
        saved: '+2h 30m saved. No re-typing.'
      }
    });
  };

  backToQueue = () => this.go('queue');
  openFlag = () => this.go('dflag');
  openYours = () => this.go('dyours');
  tapDevi = () => this.showToast('Already approved, in 22 minutes. That used to take days.', 'ok');

  approveAnyway = () => {
    this.showToast('⚠ Blocked: the passport rule fails, so approval is disabled. The old flow had no such guard.', 'err');
  };

  returnFlag = () => {
    this.addSaved(60);
    this.go('queue', { flagReturned: true });
    this.showToast('✓ Returned with the reason attached. The client sees exactly what to fix. +1h saved.', 'ok');
  };

  approveYours = () => {
    this.addSaved(45);
    this.setState({
      yoursApproved: true,
      screen: 'inter',
      inter: {
        kicker: 'APPROVED · BACK TO ROLE 1',
        title: 'Good news — you’re approved.',
        body: 'You’re the client again. The approval is already visible on your side. One step left: payment.',
        cta: 'Open the order',
        next: 'pay',
        saved: '+45m saved. Nobody has to ask for updates.'
      }
    });
  };

  uploadSlip = () => {
    this.setState({ slip: true, payErr: false });
    this.showToast('✓ transfer-slip.jpg attached to the order.', 'ok');
  };

  markPaid = () => {
    if (!this.state.slip) {
      this.setState({ payErr: true });
      this.showToast('⚠ Blocked: no transfer slip attached. This wall used to be a phone call from finance, a week later.', 'err');
      return;
    }
    this.addSaved(45);
    this.setState({ paid: true, payErr: false });
    clearTimeout(this._celT);
    this._celT = setTimeout(() => {
      const ms = Date.now() - (this.state.startT || Date.now());
      const sec = Math.round(ms / 1000);
      const elapsed = Math.floor(sec / 60) + 'm ' + (sec % 60 < 10 ? '0' : '') + (sec % 60) + 's';
      this.setState({ screen: 'celebrate', elapsed: elapsed, confetti: this.makeConfetti(), toast: null });
    }, 900);
  };

  makeConfetti() {
    if (!PROPS.confettiOn) return [];
    const colors = ['#F2A93B', '#E8654B', '#5E8F68', '#F5C46B', '#241C15'];
    const arr = [];
    for (let i = 0; i < 44; i++) {
      arr.push(React.createElement('div', {
        key: i,
        style: {
          position: 'absolute', top: -20, left: (Math.random() * 100) + '%',
          width: 7 + Math.random() * 6, height: 10 + Math.random() * 8,
          background: colors[i % 5], borderRadius: 2,
          transform: 'rotate(' + Math.round(Math.random() * 180) + 'deg)',
          animation: 'fall ' + (2.2 + Math.random() * 1.8).toFixed(2) + 's ease-in ' + (Math.random() * 0.9).toFixed(2) + 's forwards',
          opacity: 0
        }
      }));
    }
    return arr;
  }

  nextG = () => {
    const order = ['g1', 'g2', 'g3', 'g4', 'g5', 'g6'];
    const i = order.indexOf(this.state.screen);
    if (i >= 0 && i < order.length - 1) this.go(order[i + 1]);
  };

  chipFor(scr) {
    const map = {
      form: 'DRAFT', queue: 'REVIEWING', dflag: 'REVIEWING', dyours: 'REVIEWING',
      pay: this.state.paid ? 'PAID' : 'APPROVED', celebrate: 'PAID',
      g1: 'DRAFT', g2: 'DRAFT', g3: 'REVIEWING', g4: 'REVIEWING', g5: 'PAID', g6: 'PAID'
    };
    return map[scr] || null;
  }

  coachFor(scr) {
    const s = this.state;
    const G = { g1: 1, g2: 2, g3: 3, g4: 4, g5: 5 };
    if (G[scr]) {
      const texts = {
        g1: 'One structured form replaced about 5 hours of staff re-typing per registration. The client owns their data, we own the rules.',
        g2: 'Validation fires at input time. Every message states the field, the rule, and the fix.',
        g3: 'Every request has a state. Before this, the queue was whichever email sat on top.',
        g4: 'All checks run before a human looks. The reviewer just decides. Press Approve.',
        g5: 'The slip attaches to the order, so finance verifies against the record, not an inbox.'
      };
      return { label: 'STEP ' + G[scr] + ' OF 6 · THE HAPPY PATH', text: texts[scr], btn: scr === 'g4' ? null : 'Next →' };
    }
    if (scr === 'form') {
      if (s.nameErr || s.contactErr) return { label: 'STUCK? GOOD.', text: 'The form names each failing field and its rule. Fix them and resubmit.' };
      return { label: 'YOUR OBJECTIVE', text: 'Fill the two empty fields, any name works. Or hit Submit now and see what happens.' };
    }
    if (scr === 'queue') {
      if (!s.flagReturned) return { label: 'YOUR OBJECTIVE', text: 'Two requests need a decision. Open M. de Vries first, something’s off.' };
      if (!s.yoursApproved) return { label: 'YOUR OBJECTIVE', text: 'One down. Now open your own, tagged YOURS.' };
      return { label: 'DONE HERE', text: 'Queue clear.' };
    }
    if (scr === 'dflag') return { label: 'YOUR CALL, REVIEWER', text: 'One rule is failing. Your call. Curious? Try Approve anyway first.' };
    if (scr === 'dyours') return { label: 'YOUR CALL, REVIEWER', text: 'Every check passes. One tap, timestamped, visible to the client instantly.' };
    if (scr === 'pay') {
      if (s.paid) return { label: 'PAID', text: 'Done. The order carries its own payment proof.' };
      if (!s.slip) return { label: 'LAST STEP: PAYMENT', text: 'Finance needs the transfer slip. Feeling lucky? Try Mark as paid first.' };
      return { label: 'LAST STEP: PAYMENT', text: 'Slip attached. Now mark it as paid.' };
    }
    return null;
  }

  componentWillUnmount() { clearInterval(this._cntT); clearTimeout(this._toastT); clearTimeout(this._celT); }

  render() {
    const s = this.state;
    const scr = s.screen;
    const coach = this.coachFor(scr);
    const chip = this.chipFor(scr);
    const inter = s.inter || {};
    const chipOn = !!chip && PROPS.showStateChip;
    const savedOn = s.dispMin > 0 && scr !== 'intro';
    const displayName = s.name.trim() || 'Your submission';

    // shared style fragments
    const labelStyle = { display: 'block', fontSize: 12.5, fontWeight: 700, margin: '14px 0 6px' };
    const req = <span style={{ color: '#E8654B' }}>*</span>;
    const inputBase = { width: '100%', border: '1.4px solid #ECE1D2', borderRadius: 12, padding: '12px 14px', fontSize: 14, boxSizing: 'border-box' };
    const inputRW = Object.assign({}, inputBase, { background: '#FAF5EC', color: '#8A7A66' });
    const inputWhite = Object.assign({}, inputBase, { background: '#fff', color: '#241C15' });
    const errLine = { color: '#E8654B', fontSize: 12, marginTop: 5, fontWeight: 600, display: 'flex', gap: 6 };
    const darkBtn = { width: '100%', padding: 15, borderRadius: 14, border: 'none', fontWeight: 800, fontSize: 15, background: '#241C15', color: '#FFFBF6', cursor: 'pointer' };
    const amberBtn = { width: '100%', padding: 15, borderRadius: 14, border: 'none', fontWeight: 800, fontSize: 15, background: '#F2A93B', color: '#3A2A08', cursor: 'pointer', boxShadow: '0 8px 20px -8px rgba(217,140,31,.55)' };
    const pill = (bg, color) => ({ fontSize: 11, fontWeight: 700, padding: '4px 10px', borderRadius: 999, background: bg, color: color });
    const idTag = { fontFamily: "'IBM Plex Mono',monospace", fontSize: 10.5, background: '#F3ECDF', color: '#8A7A66', padding: '3px 8px', borderRadius: 6 };
    const checkRow = (label, val, valColor, last) => (
      <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, padding: '6px 0', borderBottom: last ? 'none' : '1px solid #F3ECDF' }}>
        <span style={{ color: '#8A7A66' }}>{label}</span>
        <span style={{ fontWeight: 700, color: valColor }}>{val}</span>
      </div>
    );

    return (
      <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', padding: '18px 10px 40px', boxSizing: 'border-box' }}>

        <div style={{ width: 'min(402px,100%)', background: '#FFFBF6', borderRadius: 32, boxShadow: '0 30px 60px -20px rgba(36,28,21,.35),0 0 0 1px rgba(36,28,21,.06)', overflow: 'hidden', position: 'relative', display: 'flex', flexDirection: 'column', height: 'clamp(640px,94dvh,880px)' }}>

          {/* ===== HEADER STRIP ===== */}
          <div style={{ padding: '14px 16px 10px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8, flex: 'none' }}>
            <div style={{ minWidth: 104, display: 'flex' }}>
              {chipOn &&
                <div style={{ fontFamily: "'IBM Plex Mono',monospace", fontSize: 9.5, letterSpacing: '.08em', fontWeight: 600, background: '#F3ECDF', color: '#8A7A66', padding: '5px 9px', borderRadius: 7, whiteSpace: 'nowrap' }}>STATE · {chip}</div>}
            </div>
            <div style={{ fontSize: 10.5, color: '#B8AC98', letterSpacing: '.02em', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', minWidth: 0, flex: 1, textAlign: 'center', padding: '0 6px' }}>anonymized case prototype</div>
            <div style={{ minWidth: 104, display: 'flex', justifyContent: 'flex-end' }}>
              {savedOn &&
                <div key={s.dispMin} style={{ fontFamily: "'IBM Plex Mono',monospace", fontSize: 13, fontWeight: 700, background: '#E7F1E6', color: '#4C7A56', padding: '8px 12px', borderRadius: 10, whiteSpace: 'nowrap', animation: 'pulseChip .5s ease', border: '1px solid #CBE0C9' }}>⏱ {this.fmtMin(s.dispMin)} saved</div>}
            </div>
          </div>

          {/* ===== BODY ===== */}
          <div style={{ flex: 1, overflowY: 'auto', position: 'relative', display: 'flex', flexDirection: 'column' }}>

            {/* INTRO */}
            {scr === 'intro' &&
              <div style={{ padding: '26px 24px 30px', display: 'flex', flexDirection: 'column', gap: 0, flex: 1, justifyContent: 'center' }}>
                <div style={{ fontFamily: "'IBM Plex Mono',monospace", fontSize: 10, letterSpacing: '.14em', color: '#D98C1F', fontWeight: 600 }}>AN INTERACTIVE CASE STUDY</div>
                <h1 style={{ fontSize: 27, fontWeight: 800, lineHeight: 1.18, margin: '10px 0 12px', letterSpacing: '-0.01em' }}>One registration.<br />Two ways to see it.</h1>
                <p style={{ fontSize: 13.5, lineHeight: 1.6, color: '#8A7A66', margin: '0 0 24px' }}>How a study-abroad agency replaced a 5-hour, email-driven registration process with a self-serve flow. Form, review, payment, all states included.</p>

                <div onClick={this.choosePlay} className="choice-amber" style={{ background: '#F2A93B', borderRadius: 18, padding: '18px 18px 16px', cursor: 'pointer', marginBottom: 12, boxShadow: '0 8px 20px -8px rgba(217,140,31,.55)' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8 }}>
                    <div style={{ fontFamily: "'IBM Plex Mono',monospace", fontSize: 9.5, letterSpacing: '.12em', fontWeight: 600, color: '#7A5410' }}>HANDS-ON · ~3 MIN</div>
                    <div style={{ fontFamily: "'IBM Plex Mono',monospace", fontSize: 9.5, letterSpacing: '.08em', fontWeight: 600, background: '#241C15', color: '#F2A93B', padding: '4px 8px', borderRadius: 6 }}>THE FUN ONE</div>
                  </div>
                  <div style={{ fontSize: 18, fontWeight: 800, color: '#3A2A08', margin: '8px 0 5px' }}>Let me try it →</div>
                  <div style={{ fontSize: 12.5, lineHeight: 1.5, color: '#5C4210' }}>Play both sides: submit a registration as the corporate client, then switch roles and approve it as the reviewer. Two things will go wrong. On purpose.</div>
                </div>

                <div onClick={this.chooseGuided} className="choice-white" style={{ background: '#fff', border: '1.4px solid #ECE1D2', borderRadius: 18, padding: '18px 18px 16px', cursor: 'pointer' }}>
                  <div style={{ fontFamily: "'IBM Plex Mono',monospace", fontSize: 9.5, letterSpacing: '.12em', fontWeight: 600, color: '#B8AC98' }}>GUIDED · ~2 MIN</div>
                  <div style={{ fontSize: 18, fontWeight: 800, margin: '8px 0 5px' }}>Walk me through it →</div>
                  <div style={{ fontSize: 12.5, lineHeight: 1.5, color: '#8A7A66' }}>The happy path, step by step. You just press Next; I do the talking.</div>
                </div>

                <div style={{ fontSize: 10.5, color: '#B8AC98', textAlign: 'center', marginTop: 22, lineHeight: 1.5 }}>All names, IDs and organisations are fictional.<br />Built by Wei Yun Neve Ning.</div>
              </div>}

            {/* INTERSTITIAL */}
            {scr === 'inter' &&
              <div style={{ padding: '30px 26px', display: 'flex', flexDirection: 'column', justifyContent: 'center', flex: 1, animation: 'popIn .35s ease' }}>
                <div style={{ fontFamily: "'IBM Plex Mono',monospace", fontSize: 10, letterSpacing: '.14em', color: '#D98C1F', fontWeight: 600 }}>{inter.kicker}</div>
                <h2 style={{ fontSize: 25, fontWeight: 800, lineHeight: 1.2, margin: '10px 0 12px', letterSpacing: '-0.01em' }}>{inter.title}</h2>
                <p style={{ fontSize: 14, lineHeight: 1.65, color: '#5C5245', margin: '0 0 18px' }}>{inter.body}</p>
                {inter.saved &&
                  <div style={{ display: 'inline-flex', alignSelf: 'flex-start', fontFamily: "'IBM Plex Mono',monospace", fontSize: 14, fontWeight: 700, background: '#E7F1E6', color: '#4C7A56', padding: '10px 14px', borderRadius: 10, marginBottom: 18, border: '1px solid #CBE0C9' }}>{inter.saved}</div>}
                <button onClick={this.interGo} style={darkBtn}>{inter.cta}</button>
              </div>}

            {/* PLAY: FORM */}
            {scr === 'form' &&
              <div style={{ padding: '4px 22px 28px' }}>
                <h2 style={{ fontSize: 21, fontWeight: 800, margin: '6px 0 2px' }}>New Registration</h2>
                <div style={{ fontSize: 12, color: '#8A7A66', marginBottom: 14 }}>ESL Intensive · Cebu · 4 weeks · OY-2101</div>

                <label style={labelStyle}>Student name {req} <span style={{ fontWeight: 500, color: '#B8AC98' }}>· yours to fill</span></label>
                <input value={s.name} onChange={this.onName} placeholder="Type any name" style={inputWhite} />
                {s.nameErr && <div style={errLine}><span>⚠</span><span>Required — the enrolment can't be issued without a legal name.</span></div>}

                <label style={labelStyle}>Passport No. {req}</label>
                <input value="TR889012" readOnly style={inputRW} />

                <label style={labelStyle}>Date of birth {req}</label>
                <input value="12 / 03 / 1998" readOnly style={inputRW} />

                <label style={labelStyle}>Emergency contact {req} <span style={{ fontWeight: 500, color: '#B8AC98' }}>· yours to fill</span></label>
                <input value={s.contact} onChange={this.onContact} placeholder="Name + phone, anything works" style={inputWhite} />
                {s.contactErr && <div style={errLine}><span>⚠</span><span>Required — insurance can't be activated without a reachable contact.</span></div>}

                <label style={labelStyle}>Company cost centre {req}</label>
                <input value="MKT-02 · Marketing" readOnly style={inputRW} />

                <button onClick={this.submitForm} style={Object.assign({}, darkBtn, { marginTop: 22 })}>Submit registration</button>
              </div>}

            {/* PLAY: REVIEWER QUEUE */}
            {scr === 'queue' &&
              <div style={{ padding: '4px 22px 28px' }}>
                <h2 style={{ fontSize: 21, fontWeight: 800, margin: '6px 0 2px' }}>Reviewer Queue</h2>
                <div style={{ fontSize: 12, color: '#8A7A66', marginBottom: 14 }}>Sorted by state, then age — not by inbox position.</div>

                <div onClick={this.openFlag} className="qcard-flag" style={{ background: '#fff', border: '1.4px solid #ECE1D2', borderRadius: 16, padding: '14px 16px', marginBottom: 12, cursor: 'pointer' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 8 }}>
                    <div style={{ fontSize: 15, fontWeight: 800 }}>M. de Vries</div>
                    <div style={idTag}>OY-2094</div>
                  </div>
                  <div style={{ fontSize: 12.5, color: '#8A7A66', marginTop: 3 }}>Sales · 4 weeks · submitted 1 day ago</div>
                  {!s.flagReturned &&
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 9 }}>
                      <span style={pill('#FDF1DC', '#D98C1F')}>Reviewing</span>
                      <span style={{ fontSize: 11.5, fontWeight: 600, color: '#E8654B' }}>⚠ 1 rule failing</span>
                    </div>}
                  {s.flagReturned &&
                    <div style={{ marginTop: 9 }}><span style={pill('#FCE9E4', '#E8654B')}>Returned — reason attached</span></div>}
                </div>

                <div onClick={this.openYours} className="qcard-yours" style={{ background: '#fff', border: '1.4px solid #ECE1D2', borderRadius: 16, padding: '14px 16px', marginBottom: 12, cursor: 'pointer' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 8 }}>
                    <div style={{ fontSize: 15, fontWeight: 800 }}>{displayName}</div>
                    <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
                      <span style={{ fontFamily: "'IBM Plex Mono',monospace", fontSize: 9.5, letterSpacing: '.06em', fontWeight: 600, background: '#241C15', color: '#F2A93B', padding: '3px 7px', borderRadius: 6 }}>YOURS</span>
                      <span style={idTag}>OY-2101</span>
                    </div>

                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 10, paddingTop: 10, borderTop: '1px solid #F3ECDF' }}>
                    <span style={{ fontSize: 13, color: '#8A7A66' }}>Bank transfer slip</span>

                <input value="TR889012" readOnly style={inputWhite} />

                <input value="K. Morifuji · +81 90 0000 0000" readOnly style={inputWhite} />

            {scr === 'g2' &&

              </div>}

            {/* GUIDED 3 */}
            {scr === 'g3' &&
              <div style={{ padding: '4px 22px 28px' }}>
                <h2 style={{ fontSize: 21, fontWeight: 800, margin: '6px 0 2px' }}>Reviewer Queue</h2>

                <div style={{ background: '#fff', border: '1.4px solid #ECE1D2', borderRadius: 16, padding: '14px 16px', marginBottom: 12 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}><div style={{ fontSize: 15, fontWeight: 800 }}>E. Morifuji</div><div style={idTag}>OY-2101</div></div>
                  <div style={{ fontSize: 12.5, color: '#8A7A66', marginTop: 3 }}>Submitted 4 min ago</div>
                  <div style={{ marginTop: 9 }}><span style={pill('#FDF1DC', '#D98C1F')}>Reviewing</span></div>
                </div>
                <div style={{ background: '#fff', border: '1.4px solid #ECE1D2', borderRadius: 16, padding: '14px 16px', marginBottom: 12 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}><div style={{ fontSize: 15, fontWeight: 800 }}>R. Devi</div><div style={idTag}>OY-2089</div></div>
                  <div style={{ fontSize: 12.5, color: '#8A7A66', marginTop: 3 }}>Approved in 22 min</div>
                  <div style={{ marginTop: 9 }}><span style={pill('#E7F1E6', '#5E8F68')}>Approved</span></div>
                </div>
                <div style={{ background: '#fff', border: '1.4px solid #ECE1D2', borderRadius: 16, padding: '14px 16px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}><div style={{ fontSize: 15, fontWeight: 800 }}>M. de Vries</div><div style={idTag}>OY-2094</div></div>
                  <div style={{ fontSize: 12.5, color: '#8A7A66', marginTop: 3 }}>Returned — passport rule, reason attached</div>
                  <div style={{ marginTop: 9 }}><span style={pill('#FCE9E4', '#E8654B')}>Returned</span></div>
                </div>
              </div>}

            {/* GUIDED 4 */}
            {scr === 'g4' &&
              <div style={{ padding: '4px 22px 28px' }}>
                <h2 style={{ fontSize: 21, fontWeight: 800, margin: '6px 0 2px' }}>E. Morifuji</h2>
                <div style={{ fontSize: 12, color: '#8A7A66', marginBottom: 16 }}>OY-2101 · every check computed before a human looks</div>
                <div style={{ background: '#fff', border: '1.4px solid #ECE1D2', borderRadius: 16, padding: '14px 16px', marginBottom: 18 }}>
                  {checkRow('Legal name', '✓ pass', '#5E8F68')}
                  {checkRow('Passport validity', '✓ pass', '#5E8F68')}
                  {checkRow('Emergency contact', '✓ pass', '#5E8F68')}
                  {checkRow('Cost centre budget', '✓ pass', '#5E8F68', true)}
                </div>
                <button onClick={this.nextG} style={amberBtn}>Approve — one tap, timestamped</button>
              </div>}

            {/* GUIDED 5 */}
            {scr === 'g5' &&
              <div style={{ padding: '4px 22px 28px' }}>
                <h2 style={{ fontSize: 21, fontWeight: 800, margin: '6px 0 2px' }}>Order · OY-2101</h2>
                <div style={{ fontSize: 12, color: '#8A7A66', marginBottom: 16 }}>Payment proof lives on the record — not in an inbox.</div>
                <div style={{ background: '#fff', border: '1.4px solid #ECE1D2', borderRadius: 16, padding: 16 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <div style={{ fontSize: 15, fontWeight: 800 }}>ESL Course Application</div>
                    <span style={pill('#E7F1E6', '#5E8F68')}>Paid</span>
                  </div>

                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 10, paddingTop: 10, borderTop: '1px solid #F3ECDF' }}>
                    <span style={{ fontSize: 13, color: '#8A7A66' }}>Bank transfer slip</span>
                    <span style={{ fontFamily: "'IBM Plex Mono',monospace", fontSize: 11, fontWeight: 600, background: '#E7F1E6', color: '#5E8F68', padding: '6px 10px', borderRadius: 8 }}>transfer-slip.jpg ✓</span>
                  </div>
                </div>
              </div>}

            {/* GUIDED 6 */}
            {scr === 'g6' &&
              <div style={{ padding: '26px 24px 30px', display: 'flex', flexDirection: 'column', justifyContent: 'center', flex: 1 }}>
                <div style={{ fontFamily: "'IBM Plex Mono',monospace", fontSize: 10, letterSpacing: '.14em', color: '#D98C1F', fontWeight: 600 }}>WHAT CHANGED</div>

                <div style={{ background: '#241C15', borderRadius: 18, padding: 18, marginBottom: 16 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', padding: '8px 0', borderBottom: '1px solid rgba(255,251,246,.12)' }}><span style={{ fontSize: 12.5, color: '#B8AC98' }}>Handling per registration</span><span style={{ fontSize: 16, fontWeight: 800, color: '#F2A93B' }}>~5 h → minutes</span></div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', padding: '8px 0', borderBottom: '1px solid rgba(255,251,246,.12)' }}><span style={{ fontSize: 12.5, color: '#B8AC98' }}>Approval turnaround</span><span style={{ fontSize: 16, fontWeight: 800, color: '#F2A93B' }}>days → same day</span></div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', padding: '8px 0' }}><span style={{ fontSize: 12.5, color: '#B8AC98' }}>"Where is it?" emails</span><span style={{ fontSize: 16, fontWeight: 800, color: '#F2A93B' }}>a state, not a thread</span></div>
                </div>
                <button onClick={this.choosePlay} style={Object.assign({}, amberBtn, { boxShadow: 'none', marginBottom: 10 })}>Now try it yourself — play both roles →</button>
                <button onClick={this.restartAll} style={{ width: '100%', padding: 13, borderRadius: 14, border: '1.4px solid #ECE1D2', fontWeight: 700, fontSize: 13.5, background: 'transparent', color: '#8A7A66', cursor: 'pointer' }}>Back to start</button>
              </div>}

            {/* TOAST */}
            {s.toast &&
              <div style={{ position: 'absolute', left: 16, right: 16, bottom: 14, zIndex: 5, animation: 'toastIn .25s ease' }}>
                <div style={{ background: s.toastTone === 'err' ? '#B4462E' : '#3F5E46', color: '#FFFBF6', borderRadius: 14, padding: '13px 16px', fontSize: 13.5, lineHeight: 1.5, fontWeight: 600, boxShadow: '0 12px 28px -8px rgba(36,28,21,.5)' }}>{s.toast}</div>
              </div>}
          </div>

          {/* ===== COACH BAR ===== */}
          {coach &&
            <div style={{ background: '#241C15', color: '#FFFBF6', padding: '16px 20px 18px', flex: 'none', borderTop: '3px solid #F2A93B', boxShadow: '0 -14px 30px -12px rgba(36,28,21,.45)' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 10 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <div style={{ width: 9, height: 9, borderRadius: '50%', background: '#F2A93B', animation: 'pulseChip 1.4s ease infinite' }}></div>
                  <div style={{ fontFamily: "'IBM Plex Mono',monospace", fontSize: 11, letterSpacing: '.14em', color: '#F2A93B', fontWeight: 600 }}>{coach.label}</div>
                </div>
                <div onClick={this.restartAll} className="restart-pill" style={{ fontFamily: "'IBM Plex Mono',monospace", fontSize: 10.5, letterSpacing: '.06em', fontWeight: 600, color: '#FFFBF6', cursor: 'pointer', border: '1.4px solid rgba(255,251,246,.4)', padding: '6px 12px', borderRadius: 999 }}>↺ RESTART</div>
              </div>
              <div style={{ fontSize: 15, lineHeight: 1.5, marginTop: 9, color: '#FFFBF6', fontWeight: 500 }}>{coach.text}</div>
              {coach.btn &&
                <button onClick={this.nextG} style={{ width: '100%', padding: 12, borderRadius: 12, border: 'none', fontWeight: 800, fontSize: 13.5, background: '#F2A93B', color: '#3A2A08', cursor: 'pointer', marginTop: 10 }}>{coach.btn}</button>}
            </div>}

        </div>

        <div style={{ fontFamily: "'IBM Plex Mono',monospace", fontSize: 10.5, color: '#8A7A66', textAlign: 'center', padding: '16px 20px 0', lineHeight: 1.6 }}>Portfolio case study prototype · all data fictional · Wei Yun Neve Ning</div>
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

    (0, eval)(out);
